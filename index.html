<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>GPS Entregador</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#007AFF">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css'">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font:16px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:#1c1c1e;background:#e5e3df}
#map{position:fixed;inset:0}
button,a{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-decoration:none}
[hidden]{display:none!important}
.g{background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:66dvh;overflow:auto;border-radius:22px 22px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 16px);z-index:5}
@media(min-width:720px){#sheet{left:12px;right:auto;width:410px;bottom:12px;border-radius:22px}}
#q{width:100%;height:46px;border:0;border-radius:12px;background:rgba(120,120,128,.14);padding:0 14px;font-size:17px;outline:0}
.h{color:#6e6e73;font-size:14px;line-height:1.45;margin:12px 4px}
.er{background:rgba(255,59,48,.12);color:#d70015;border-radius:12px;padding:10px 12px;font-size:14px}
.row{display:block;width:100%;text-align:left;padding:11px 6px;border-bottom:1px solid rgba(60,60,67,.14)}
.row b,.t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small,.t small{display:block;color:#6e6e73;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid rgba(60,60,67,.14)}
.st .t{flex:1;min-width:0}
.st button{width:32px;height:32px;border-radius:8px;color:#6e6e73;font-size:17px}
.n,.pin{width:26px;height:26px;border-radius:50%;background:#ff3b30;color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.pin{width:30px;height:30px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.seg{display:flex;gap:2px;background:rgba(120,120,128,.14);border-radius:11px;padding:2px;margin:12px 0}
.seg button{flex:1;padding:9px 0;border-radius:9px;font-weight:600;font-size:14px;color:#6e6e73}
.seg .on{background:#fff;color:#1c1c1e;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.sum{font-size:17px;margin:4px 2px 10px}.sum b{font-size:24px}
.go{width:100%;height:54px;border-radius:14px;background:#34c759;color:#fff;font-size:19px;font-weight:700}
.lk{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lk>*{background:rgba(120,120,128,.14);border-radius:16px;padding:8px 13px;font-size:14.5px;font-weight:500}
.lk a{color:#007aff}
#fab{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 14px);z-index:6;display:flex;flex-direction:column;border-radius:14px;overflow:hidden}
#fab button{width:46px;height:46px;font-size:20px;display:grid;place-items:center;color:#007aff}
#fab button+button{border-top:1px solid rgba(60,60,67,.16)}
#bn{position:fixed;left:10px;right:70px;top:calc(env(safe-area-inset-top) + 10px);z-index:7;background:rgba(255,149,0,.96);color:#fff;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.35}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);background:rgba(30,30,32,.94);color:#fff;padding:10px 18px;border-radius:20px;font-size:14.5px;z-index:9;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
#toast.on{opacity:1}
#nTop{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 10px);z-index:6;background:rgba(24,24,27,.95);color:#fff;border-radius:20px;padding:14px 16px;display:flex;gap:14px;align-items:center}
#nA{font-size:46px;width:56px;text-align:center;line-height:1}
#nD{font-size:36px;font-weight:700;line-height:1}
#nW{font-size:18px;margin-top:4px;line-height:1.2}
#nBot{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:6;border-radius:24px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:8px}
#nBot>div{flex:1;text-align:center}#nBot b{display:block;font-size:21px;line-height:1.1}#nBot i{font-style:normal;font-size:12px;color:#6e6e73}
#nX{flex:none!important;width:54px;height:54px;border-radius:50%;background:#ff3b30;color:#fff;font-weight:700;font-size:14px}
#rc{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 100px);z-index:7;background:#007aff;color:#fff;border-radius:22px;padding:11px 20px;font-weight:600}
#card{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 96px);z-index:8;border-radius:22px;padding:14px}
#card b{font-size:19px;display:block}#card small{color:#6e6e73;display:block;margin-bottom:10px}
.cb{display:flex;gap:8px}.cb>*{flex:1;text-align:center;background:rgba(120,120,128,.14);border-radius:12px;padding:12px 6px;font-weight:600}.cb button:first-child{background:#007aff;color:#fff}
.me{width:22px;height:22px;border-radius:50%;background:#007aff;border:3px solid #fff;box-shadow:0 0 0 12px rgba(0,122,255,.18),0 2px 8px rgba(0,0,0,.4)}
.maplibregl-ctrl-bottom-left{bottom:auto!important;top:calc(env(safe-area-inset-top) + 4px)}
</style></head>
<body>
<div id="map"></div><div id="bn" hidden></div><div id="toast"></div>
<div id="fab" class="g"><button id="bLoc" aria-label="Minha localização"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 11 21 3l-8 18-2-8z" fill="currentColor"/></svg></button><button id="bVoz" aria-label="Voz" hidden>🔊</button></div>
<button id="rc" hidden>Recentralizar</button>
<div id="sheet" class="g"><input id="q" type="search" placeholder="Endereço, local, CEP ou link" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"><div id="body"></div></div>
<div id="nTop" hidden><div id="nA">↑</div><div><div id="nD">—</div><div id="nW"></div></div></div>
<div id="card" class="g" hidden></div>
<div id="nBot" class="g" hidden><div><b id="nE">--</b><i>chegada</i></div><div><b id="nM">--</b><i>tempo</i></div><div><b id="nK">--</b><i>km</i></div><div><b id="nV">0</b><i>km/h</i></div><button id="nX">Sair</button></div>
<script>
(()=>{
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={mode:'motorcycle',stops:[],pos:null,route:null,nav:null,voice:true,res:[],msg:'',tok:0,rt:0,busy:0,busyR:0,err:''};
const MODES={motorcycle:['Moto',11],auto:['Carro',12],bicycle:['Bike',4.5],pedestrian:['A pé',1.4]};
const R0=6371008,rad=d=>d*Math.PI/180,low=s=>s.charAt(0).toLowerCase()+s.slice(1);
const hav=(a,b)=>{const x=rad(b[1]-a[1]),y=rad(b[0]-a[0]),s=Math.sin(x/2)**2+Math.cos(rad(a[1]))*Math.cos(rad(b[1]))*Math.sin(y/2)**2;return 2*R0*Math.asin(Math.sqrt(s))};
const brg=(a,b)=>{const y=Math.sin(rad(b[0]-a[0]))*Math.cos(rad(b[1])),x=Math.cos(rad(a[1]))*Math.sin(rad(b[1]))-Math.sin(rad(a[1]))*Math.cos(rad(b[1]))*Math.cos(rad(b[0]-a[0]));return(Math.atan2(y,x)*180/Math.PI+360)%360};
function dec(str){let i=0,la=0,ln=0,o=[];while(i<str.length){let b,s=0,r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<s;s+=5}while(b>=32);la+=r&1?~(r>>1):r>>1;s=0;r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<s;s+=5}while(b>=32);ln+=r&1?~(r>>1):r>>1;o.push([ln/1e6,la/1e6])}return o}
const fd=m=>m<1000?Math.max(10,Math.round(m/10)*10)+' m':(m/1000).toFixed(m<10000?1:0).replace('.',',')+' km';
const fm=s=>{const m=Math.max(1,Math.round(s/60));return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'};
const clk=s=>{const d=new Date(Date.now()+s*1000);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const sd=m=>m<1000?Math.max(50,Math.round(m/50)*50)+' metros':(Math.round(m/100)/10+'').replace('.',',')+' quilômetros';
const ar=t=>[10,11,18,20,23].includes(t)?'↱':[14,15,19,21,24].includes(t)?'↰':t===9?'↗':t===16?'↖':t===12||t===13?'↶':t===26?'⟳':[4,5,6].includes(t)?'⚑':'↑';
let toastT;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3000)};
const bn=m=>{const b=$('#bn');b.hidden=!m;b.textContent=m||''};
const J=async u=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(t)}};

/* ---------- voz ---------- */
let vz=[];const lv=()=>{try{vz=speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang))}catch(e){}};lv();try{speechSynthesis.addEventListener('voiceschanged',lv)}catch(e){}
function say(t,u){if(!S.voice||!('speechSynthesis' in window))return;try{speechSynthesis.resume();if(u)speechSynthesis.cancel();const m=new SpeechSynthesisUtterance(t.replace(/\b([A-Z]{2,3})-(\d{2,3})\b/g,'$1 $2'));m.lang='pt-BR';const v=vz.find(x=>/pt[-_]BR/i.test(x.lang)&&/luciana|francisca|google|natural|premium|enhanced/i.test(x.name))||vz.find(x=>/pt[-_]BR/i.test(x.lang))||vz[0];if(v)m.voice=v;speechSynthesis.speak(m)}catch(e){}}
const unlock=()=>{try{const m=new SpeechSynthesisUtterance(' ');m.volume=0;speechSynthesis.speak(m)}catch(e){}};

/* ---------- tela ligada e segundo plano (melhor esforço) ---------- */
let wl,au;
const wake=async on=>{try{if(on)wl=await navigator.wakeLock.request('screen');else if(wl){await wl.release();wl=null}}catch(e){}};
const keep={start(){try{if(!au){const n=8000,b=new Uint8Array(44+n),v=new DataView(b.buffer),w=(o,t)=>[...t].forEach((c,i)=>b[o+i]=c.charCodeAt(0));w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);for(let i=0;i<n;i++)b[44+i]=128+(i%2?1:-1);au=new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'})));au.loop=true}au.play().catch(()=>{});if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:'Navegando',artist:'GPS Entregador'})}catch(e){}},stop(){try{au&&au.pause();navigator.mediaSession.metadata=null}catch(e){}}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.nav){wake(1);au&&au.play().catch(()=>{});if(S.pos)tick(S.pos)}});

/* ---------- busca ---------- */
const coord=q=>{const m=q.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||q.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||q.match(/[?&](?:q|ll|query|destination)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/)||q.match(/^(-?\d{1,2}[.,]\d+)\s*[,;\s]\s*(-?\d{1,3}[.,]\d+)$/);if(!m)return null;const a=+m[1].replace(',','.'),b=+m[2].replace(',','.');return a>=-35&&a<=6&&b>=-75&&b<=-27?[b,a]:null};
const pho=async q=>{let u='https://photon.komoot.io/api/?limit=8&bbox=-74.2,-33.9,-28.5,5.4&q='+encodeURIComponent(q);if(S.pos)u+='&lat='+S.pos.lat+'&lon='+S.pos.lng;const j=await J(u);return j.features.filter(f=>(f.properties.countrycode||'').toUpperCase()==='BR').map(f=>{const p=f.properties,st=p.street?p.street+(p.housenumber?', '+p.housenumber:''):'';return{title:p.name||st||p.city||'Local',num:p.housenumber||'',sub:[p.name&&st?st:'',p.district||'',[p.city,p.state].filter(Boolean).join(' - ')].filter(Boolean).join(' · '),lng:f.geometry.coordinates[0],lat:f.geometry.coordinates[1]}})};
const nom=async q=>{const j=await J('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&countrycodes=br&accept-language=pt-BR&q='+encodeURIComponent(q));return j.map(r=>{const a=r.address||{},rd=a.road||a.pedestrian||'';return{title:r.name||(rd?rd+(a.house_number?', '+a.house_number:''):r.display_name.split(',')[0]),num:a.house_number||'',sub:[a.suburb||a.neighbourhood||'',[a.city||a.town||a.village||'',a.state||''].filter(Boolean).join(' - ')].filter(Boolean).join(' · '),lng:+r.lon,lat:+r.lat}})};
async function find(q,deep){const t=++S.tok;S.msg='';S.busy=1;view();const d=coord(q);
 if(d){S.res=[{title:'Coordenadas',sub:d[1].toFixed(5)+', '+d[0].toFixed(5),lng:d[0],lat:d[1]}];S.busy=0;view();return}
 if(/(maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/kgs)/i.test(q)){S.res=[];S.msg='Esse link curto do Google Maps não dá para ler aqui. Abra o link, copie o endereço ou as coordenadas e cole na busca.';S.busy=0;view();return}
 try{let res=[];
  if(/^\d{5}-?\d{3}$/.test(q)){const c=await J('https://viacep.com.br/ws/'+q.replace(/\D/g,'')+'/json/');if(c.erro)throw 0;res=await nom([c.logradouro,c.bairro,c.localidade,c.uf].join(', '));res.forEach(r=>{r.title=c.logradouro||r.title;r.sub='CEP '+c.cep+' · '+c.localidade+' - '+c.uf})}
  else if(deep){const a=await Promise.all([nom(q).catch(()=>[]),pho(q).catch(()=>[])]);res=a[0].concat(a[1])}
  else{res=await pho(q).catch(()=>[]);if(!res.length)res=await nom(q).catch(()=>[])}
  if(t!==S.tok)return;S.res=res.slice(0,10);if(!res.length)S.msg='Nada encontrado. Toque em Buscar no teclado para uma busca mais detalhada: rua, número e cidade.'
 }catch(e){if(t!==S.tok)return;S.res=[];S.msg='Não consegui buscar agora. Tente de novo.'}
 S.busy=0;view()}
let qt;
$('#q').addEventListener('input',()=>{clearTimeout(qt);const q=$('#q').value.trim();if(q.length<3){S.res=[];S.msg='';view();return}qt=setTimeout(()=>find(q,false),400);view()});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const q=$('#q').value.trim();if(q.length>1){clearTimeout(qt);find(q,true);e.target.blur()}}});

/* ---------- paradas ---------- */
const ll=s=>s.lat.toFixed(6)+','+s.lng.toFixed(6);
const gm=()=>{const l=S.stops.filter(s=>!s.done).slice(0,10);if(!l.length)return'#';const d=l[l.length-1],w=l.slice(0,-1);return'https://www.google.com/maps/dir/?api=1&destination='+ll(d)+'&travelmode='+({motorcycle:'two-wheeler',auto:'driving',bicycle:'bicycling',pedestrian:'walking'}[S.mode])+(S.pos?'&origin='+S.pos.lat.toFixed(6)+','+S.pos.lng.toFixed(6):'')+(w.length?'&waypoints='+w.map(ll).join('%7C'):'')};
const wz=()=>{const l=S.stops.filter(s=>!s.done);return l.length?'https://waze.com/ul?ll='+ll(l[0])+'&navigate=yes':'#'};
function addStop(r){S.stops.push({title:r.title,sub:r.sub,num:r.num||'',lng:r.lng,lat:r.lat,label:'',phone:'',done:0});$('#q').value='';S.res=[];S.msg='';mk();plan()}
function opt(){if(!S.pos)return;let c=[S.pos.lng,S.pos.lat],l=S.stops.slice(),o=[];while(l.length){let k=0,m=1e12;l.forEach((s,j)=>{const d=hav(c,[s.lng,s.lat]);if(d<m){m=d;k=j}});const s=l.splice(k,1)[0];o.push(s);c=[s.lng,s.lat]}S.stops=o;mk();plan();toast('Ordem otimizada pela menor distância')}
$('#body').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,s=S.stops;
 if(a==='add')addStop(S.res[i]);
 else if(a==='rm'){s.splice(i,1);mk();plan()}
 else if(a==='up'&&i>0){[s[i-1],s[i]]=[s[i],s[i-1]];mk();plan()}
 else if(a==='dn'&&i<s.length-1){[s[i+1],s[i]]=[s[i],s[i+1]];mk();plan()}
 else if(a==='ed'){const x=s[i],n=prompt('Número da casa (a voz avisa na chegada):',x.num);if(n===null)return;x.num=n.trim();const l=prompt('Nome do cliente ou pedido (opcional):',x.label);if(l!==null)x.label=l.trim();const t=prompt('Telefone do cliente (opcional):',x.phone);if(t!==null)x.phone=t.trim();view()}
 else if(a==='mode'){S.mode=b.dataset.k;plan()}
 else if(a==='opt')opt();
 else if(a==='clr'){S.stops=[];mk();plan()}
 else if(a==='go')start()});
function view(){const b=$('#body'),q=$('#q').value.trim();
 if(q.length>=3){b.innerHTML=(S.busy?'<p class="h">Buscando…</p>':'')+S.res.map((r,i)=>`<button class="row" data-a="add" data-i="${i}"><b>${E(r.title)}</b><small>${E(r.sub)}</small></button>`).join('')+(S.msg&&!S.busy?`<p class="h">${E(S.msg)}</p>`:'');return}
 if(!S.stops.length){b.innerHTML='<p class="h">Busque o endereço da entrega, cole um link do Google Maps ou coordenadas. Segure o dedo no mapa para marcar um ponto. Cada endereço escolhido vira uma parada.</p>';return}
 const r=S.route;
 b.innerHTML=S.stops.map((s,i)=>`<div class="st"><span class="n">${i+1}</span><div class="t"><b>${E(s.label?s.label+' · ':'')+E(s.title)}</b><small>${E((s.num?'nº '+s.num+' · ':'')+s.sub)}</small></div><button data-a="up" data-i="${i}">↑</button><button data-a="dn" data-i="${i}">↓</button><button data-a="ed" data-i="${i}">✎</button><button data-a="rm" data-i="${i}">✕</button></div>`).join('')
 +`<div class="seg">${Object.keys(MODES).map(k=>`<button class="${k===S.mode?'on':''}" data-a="mode" data-k="${k}">${MODES[k][0]}</button>`).join('')}</div>`
 +(S.busyR?'<p class="h">Calculando rota…</p>':S.err?`<p class="er">${E(S.err)}</p>`:r?`<div class="sum"><b>${fm(r.dur)}</b> · ${fd(r.dist)} · chega às ${clk(r.dur)}</div>`:S.pos?'':'<p class="h">Aguardando o sinal de GPS…</p>')
 +(r?'<button class="go" data-a="go">Iniciar</button>':'')
 +`<div class="lk">${S.stops.length>2?'<button data-a="opt">Otimizar ordem</button>':''}<a target="_blank" rel="noopener" href="${gm()}">Google Maps</a><a target="_blank" rel="noopener" href="${wz()}">Waze</a><button data-a="clr">Limpar</button></div>`}

/* ---------- rota (Valhalla, instruções em português) ---------- */
async function getRoute(w,mode){const body={locations:w.map(p=>({lat:p[1],lon:p[0],type:'break'})),costing:mode,directions_options:{language:'pt-BR',units:'kilometers'}};let j=null;
 for(const c of[mode,mode==='motorcycle'?'motor_scooter':'auto']){body.costing=c;try{const r=await fetch('https://valhalla1.openstreetmap.de/route?json='+encodeURIComponent(JSON.stringify(body)));const x=await r.json();if(r.ok&&x.trip&&x.trip.status===0){j=x;break}}catch(e){}}
 if(!j)throw 0;const coords=[],steps=[],legs=j.trip.legs;
 legs.forEach((l,li)=>{const sh=dec(l.shape),off=coords.length-(li?1:0);if(li)sh.shift();for(const p of sh)coords.push(p);
  l.maneuvers.forEach(m=>{if(m.type<1||m.type===7||m.type===8||(li&&m.type<4))return;const arr=m.type>=4&&m.type<=6;steps.push({t:m.type,idx:off+m.begin_shape_index,txt:m.instruction||'',say:m.verbal_pre_transition_instruction||m.instruction||'',leg:li,arr:arr?1:0,fin:arr&&li===legs.length-1?1:0})})});
 const cum=[0];for(let i=1;i<coords.length;i++)cum.push(cum[i-1]+hav(coords[i-1],coords[i]));
 steps.forEach(s=>{s.idx=Math.min(s.idx,coords.length-1);s.at=cum[s.idx]});
 return{c:coords,cum,steps,total:cum[cum.length-1]||1,dist:j.trip.summary.length*1000,dur:j.trip.summary.time}}
const wps=()=>{const l=S.stops.filter(s=>!s.done);return S.pos&&l.length?[[S.pos.lng,S.pos.lat]].concat(l.map(s=>[s.lng,s.lat])):null};
let pt;function plan(){clearTimeout(pt);S.rt++;S.route=null;S.err='';draw();view();pt=setTimeout(calc,250)}
async function calc(){const w=wps();if(!w)return;const tk=++S.rt;S.busyR=1;view();try{const r=await getRoute(w,S.mode);if(tk!==S.rt)return;S.route=r;S.err=''}catch(e){if(tk!==S.rt)return;S.err='Não encontrei rota para esses pontos. Tente aproximar o ponto de uma rua.'}S.busyR=0;draw();fit();view()}

/* ---------- mapa ---------- */
let map,me,mks=[];const EMPTY={type:'FeatureCollection',features:[]};
const setSrc=d=>{try{const s=map&&map.getSource('r');if(s)s.setData(d)}catch(e){}};
function draw(){const r=S.nav?S.nav.r:S.route;setSrc(r?{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:r.c}}:EMPTY)}
function mk(){mks.forEach(m=>m.remove());mks=[];if(!map)return;S.stops.forEach((s,i)=>{if(s.done)return;const e=document.createElement('div');e.className='pin';e.textContent=i+1;mks.push(new maplibregl.Marker({element:e}).setLngLat([s.lng,s.lat]).addTo(map))})}
function fit(){const r=S.route;if(!r||!map)return;const b=new maplibregl.LngLatBounds(),st=Math.max(1,Math.floor(r.c.length/300));for(let i=0;i<r.c.length;i+=st)b.extend(r.c[i]);b.extend(r.c[r.c.length-1]);map.fitBounds(b,{padding:{top:80,bottom:Math.round(innerHeight*.5),left:40,right:70},maxZoom:17,duration:800,pitch:0,bearing:0})}
const OSM={version:8,sources:{o:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19,attribution:'© OpenStreetMap'}},layers:[{id:'o',type:'raster',source:'o'}]};
function init(){
 map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[-51.9,-14.2],zoom:3.6,attributionControl:false,maxPitch:65});
 map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-left');
 const el=document.createElement('div');el.className='me';me=new maplibregl.Marker({element:el});
 let ok=0,fb=0;
 map.on('style.load',()=>{ok=1;if(!map.getSource('r'))map.addSource('r',{type:'geojson',data:EMPTY});
  const f=(map.getStyle().layers||[]).find(l=>l.type==='symbol'),b=f&&f.id;
  if(!map.getLayer('rc')){const lay={'line-cap':'round','line-join':'round'};
   map.addLayer({id:'rc',type:'line',source:'r',layout:lay,paint:{'line-color':'#ffffff','line-width':['interpolate',['linear'],['zoom'],8,5,14,11,18,17]}},b);
   map.addLayer({id:'rl',type:'line',source:'r',layout:lay,paint:{'line-color':'#0A84FF','line-width':['interpolate',['linear'],['zoom'],8,3,14,7,18,12]}},b)}
  draw()});
 map.on('error',()=>{if(!ok&&!fb){fb=1;map.setStyle(OSM)}});
 map.on('dragstart',e=>{if(S.nav&&e.originalEvent){S.nav.free=1;$('#rc').hidden=0}});
 let lp;map.on('touchstart',e=>{if(e.points.length>1)return;clearTimeout(lp);lp=setTimeout(()=>drop(e.lngLat),650)});['touchend','dragstart','zoomstart'].forEach(v=>map.on(v,()=>clearTimeout(lp)));
 map.on('contextmenu',e=>drop(e.lngLat));
 geo()}
async function drop(ll2){if(S.nav)return;if(navigator.vibrate)navigator.vibrate(15);const r={title:'Local marcado',sub:ll2.lat.toFixed(5)+', '+ll2.lng.toFixed(5),num:'',lng:ll2.lng,lat:ll2.lat};
 try{const j=await J('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=pt-BR&lat='+ll2.lat+'&lon='+ll2.lng),a=j.address||{};r.title=(a.road||j.name||r.title)+(a.house_number?', '+a.house_number:'');r.num=a.house_number||'';r.sub=[a.suburb||'',a.city||a.town||''].filter(Boolean).join(' · ')||r.sub}catch(e){}addStop(r)}

/* ---------- GPS ---------- */
function geo(){if(!window.isSecureContext)bn('Para o GPS funcionar, abra este arquivo por um link seguro (https).');if(!navigator.geolocation)return;
 navigator.geolocation.watchPosition(g=>{const c=g.coords,p={lng:c.longitude,lat:c.latitude,acc:c.accuracy,speed:c.speed>0?c.speed:0,heading:c.heading};const first=!S.pos;S.pos=p;if(!/internet/.test($('#bn').textContent))bn('');me.setLngLat([p.lng,p.lat]);if(first){me.addTo(map);map.flyTo({center:[p.lng,p.lat],zoom:15.5});if(S.stops.length)calc()}if(S.nav)tick(p)},
  e=>bn(e.code===1?'Localização bloqueada. Permita a localização para este site nas configurações do navegador.':'Procurando sinal de GPS…'),{enableHighAccuracy:true,maximumAge:1000,timeout:25000})}
$('#bLoc').onclick=()=>{if(S.pos)map.flyTo({center:[S.pos.lng,S.pos.lat],zoom:16,bearing:0,pitch:0});else toast('Procurando sua localização…')};
$('#bVoz').onclick=()=>{S.voice=!S.voice;$('#bVoz').textContent=S.voice?'🔊':'🔇';if(!S.voice)try{speechSynthesis.cancel()}catch(e){}};
$('#rc').onclick=()=>{if(S.nav){S.nav.free=0;$('#rc').hidden=1;if(S.pos)tick(S.pos)}};
addEventListener('offline',()=>bn('Sem internet. A rota já carregada continua, mas busca e recálculo precisam de conexão.'));addEventListener('online',()=>bn(''));

/* ---------- navegação ---------- */
function ui(on){$('#sheet').hidden=on;$('#nTop').hidden=!on;$('#nBot').hidden=!on;$('#bVoz').hidden=!on;if(!on){$('#rc').hidden=1;$('#card').hidden=1}}
function start(){if(!S.route||!S.pos)return toast('Aguardando sinal de GPS');unlock();keep.start();const l=S.stops.filter(s=>!s.done);
 S.nav={r:S.route,st:l,si:0,li:0,off:0,rr:0,lr:0,hdg:null,done:0,free:0};ui(1);wake(1);
 say('Iniciando rota para '+(l.length>1?l.length+' paradas':l[0].title)+'. '+(S.route.steps[0]?S.route.steps[0].say:''),1);draw();tick(S.pos)}
function arrTxt(s,lead){const st=S.nav.st[s.leg],side=s.t===5?'direito':s.t===6?'esquerdo':'';let t=lead;if(st&&st.num)t+=' Número '+st.num+(side?', do lado '+side:'')+'.';else if(side)t+=' O destino fica do lado '+side+'.';return t}
function arrived(s){const st=S.nav.st[s.leg];if(!st)return;st.done=1;const n=S.stops.indexOf(st)+1;say(arrTxt(s,'Você chegou à parada '+n+(st.label?', '+st.label:'')+'.'),1);const p=(st.phone||'').replace(/\D/g,'');const c=$('#card');c.hidden=0;
 c.innerHTML=`<b>Parada ${n}${st.label?' · '+E(st.label):''}</b><small>${E(st.title)}${st.num?' · nº '+E(st.num):''}</small><div class="cb"><button onclick="this.parentNode.parentNode.hidden=true">Entregue ✓</button>${p?`<a href="tel:${p}">Ligar</a><a target="_blank" rel="noopener" href="https://wa.me/${p.length<=11?'55'+p:p}?text=${encodeURIComponent('Olá! Cheguei com o seu pedido.')}">WhatsApp</a>`:''}</div>`;mk()}
function finish(s){const N=S.nav;if(N.done)return;N.done=1;const st=N.st[s.leg];if(st)st.done=1;say(arrTxt(s,'Você chegou.'),1);$('#nA').textContent='⚑';$('#nD').textContent='Chegou!';$('#nW').textContent=(st?st.title+(st.num?' · nº '+st.num:''):'')+(s.t===5?' · lado direito':s.t===6?' · lado esquerdo':'');setTimeout(()=>{if(S.nav===N)end(1)},5000)}
function end(ok){if(!S.nav)return;S.nav=null;try{speechSynthesis.cancel()}catch(e){}wake(0);keep.stop();ui(0);map.easeTo({pitch:0,bearing:0,duration:600});if(ok){S.stops=[];S.route=null;mk();draw();view();toast('Entrega concluída ✓')}else{mk();plan()}}
$('#nX').onclick=()=>{if(confirm('Encerrar a navegação?'))end(0)};
async function reroute(p){const N=S.nav;N.rr=1;N.lr=Date.now();say('Recalculando rota.',1);toast('Recalculando rota…');const l=S.stops.filter(s=>!s.done);
 try{const r=await getRoute([[p.lng,p.lat]].concat(l.map(s=>[s.lng,s.lat])),S.mode);if(S.nav!==N)return;N.r=r;N.st=l;N.si=0;N.li=0;N.off=0;S.route=r;draw();say('Nova rota encontrada.')}catch(e){}N.rr=0}
function tick(p){const N=S.nav;if(!N||N.done)return;const R=N.r,P=[p.lng,p.lat];
 let bi=N.li,bd=1e9;for(let i=Math.max(0,N.li-5);i<=Math.min(R.c.length-1,N.li+300);i++){const d=hav(P,R.c[i]);if(d<bd){bd=d;bi=i}}
 if(bd>60)for(let i=0;i<R.c.length;i+=2){const d=hav(P,R.c[i]);if(d<bd-25){bd=d;bi=i}}
 if(bd>Math.max(50,Math.min(p.acc||20,90)*1.6)){if(++N.off>=3&&!N.rr&&Date.now()-N.lr>9000)reroute(p)}else{N.off=0;N.li=Math.max(N.li,bi)}
 const al=R.cum[N.li],v=p.speed>0?p.speed:MODES[S.mode][1];let s=R.steps[N.si];
 while(s){const d=s.at-al;if(s.arr){if(d<=25){if(!s.d){s.d=1;if(s.fin)finish(s);else arrived(s)}if(s.fin)return;s=R.steps[++N.si];continue}}else if(d<5&&N.si<R.steps.length-1){s=R.steps[++N.si];continue}break}
 if(!s)return;
 const d=Math.max(0,s.at-al),rem=Math.max(0,R.total-al),far=Math.min(1000,Math.max(300,v*28)),near=Math.min(160,Math.max(50,v*7)),st=N.st[s.leg];
 if(s.arr){if(!s.f1&&d<=Math.min(far,400)){s.f1=1;if(d>60){const sd2=s.t===5?'direito':s.t===6?'esquerdo':'';say((s.fin?'Seu destino':'A parada')+(st&&st.num?', número '+st.num+',':'')+' está a '+sd(d)+(sd2?', do lado '+sd2:''))}}}
 else{if(!s.f1&&d<=far&&d>near+40){s.f1=1;say('Em '+sd(d)+', '+low(s.say))}if(!s.f2&&d<=near){s.f2=1;say(s.say,1)}}
 let h=p.heading!=null&&v>1.5?p.heading:null;if(h==null&&bd<40)h=brg(R.c[N.li],R.c[Math.min(R.c.length-1,N.li+8)]);
 if(h!=null)N.hdg=N.hdg==null?h:(N.hdg+((h-N.hdg+540)%360-180)*.5+360)%360;
 $('#nA').textContent=ar(s.t);$('#nD').textContent=fd(d);
 $('#nW').textContent=s.arr?(s.fin?'Seu destino':'Parada '+(S.stops.indexOf(st)+1))+(st&&st.num?' · nº '+st.num:''):s.txt;
 const sec=R.dur*rem/R.total;$('#nE').textContent=clk(sec);$('#nM').textContent=fm(sec);$('#nK').textContent=(rem/1000).toFixed(1).replace('.',',');$('#nV').textContent=Math.round((p.speed||0)*3.6);
 me.setLngLat(P);
 if(!N.free&&!document.hidden)map.easeTo({center:P,bearing:N.hdg==null?0:N.hdg,pitch:50,zoom:v<5?17.2:v<12?16.7:v<20?16:15.3,duration:900,easing:t=>t,padding:{top:Math.round(innerHeight*.3),bottom:100,left:0,right:0}})}

/* ---------- início ---------- */
view();
let i=0;const libs=['https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js','https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js'];
(function next(){if(i>=libs.length){$('#map').innerHTML='<p style="padding:90px 24px;text-align:center;color:#555">Não consegui carregar o mapa. Verifique a internet e abra de novo.</p>';return}const s=document.createElement('script');s.src=libs[i++];s.onload=init;s.onerror=next;document.head.appendChild(s)})();
})();
</script>
</body></html>
